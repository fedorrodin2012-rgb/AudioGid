<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Админпанель — Аудиогид 343э (СПб)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--accent:#38bdf8;--text:#e2e8f0;--muted:#94a3b8;--danger:#f87171;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
  header{padding:12px 20px;background:var(--card);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  header h1{font-size:1.1rem}
  header .hint{color:var(--muted);font-size:.85rem}
  .layout{flex:1;display:flex;min-height:0}
  #map{flex:1;min-width:0}
  aside{width:380px;background:var(--card);display:flex;flex-direction:column;border-left:1px solid #334155}
  .form{padding:14px;border-bottom:1px solid #334155}
  .form h2{font-size:.95rem;margin-bottom:10px;color:var(--accent)}
  .form label{display:block;font-size:.8rem;color:var(--muted);margin:8px 0 4px}
  .form input,.form select{width:100%;padding:8px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:var(--text)}
  .form input[type=file]{padding:6px}
  .form button{margin-top:12px;width:100%;padding:10px;border:none;border-radius:8px;background:var(--accent);color:#0f172a;font-weight:700;cursor:pointer}
  .form button:disabled{opacity:.5;cursor:not-allowed}
  .list{flex:1;overflow-y:auto;padding:10px}
  .point{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:10px;margin-bottom:8px;font-size:.85rem}
  .point b{color:var(--accent)}
  .point .row{display:flex;justify-content:space-between;gap:8px;margin-top:6px;color:var(--muted);font-size:.75rem}
  .point button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:.8rem}
  .toolbar{display:flex;gap:8px;padding:10px;border-top:1px solid #334155}
  .toolbar button{flex:1;padding:8px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:var(--text);cursor:pointer;font-size:.8rem}
  .status{padding:6px 14px;font-size:.75rem;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>🚌 Аудиогид 343э — админпанель (СПб)</h1>
  <span class="hint">Остановки маршрута 343Э уже на карте. Клик по карте → добавить новую.</span>
</header>

<div class="layout">
  <div id="map"></div>
  <aside>
    <div class="form">
      <h2>Новая точка интереса</h2>
      <label>Название остановки</label>
      <input id="fTitle" placeholder="напр. «Невский проспект»">
      <label>Координаты (клик по карте)</label>
      <input id="fCoords" readonly placeholder="широта, долгота">
      <label>Радиус срабатывания, м</label>
      <input id="fRadius" type="number" value="100" min="20" max="1000">
      <label>Аудиофайл (AAC/M4A, 192 кбит/с, 48 кГц, моно)</label>
      <input id="fAudio" type="file" accept="audio/mp4,audio/aac,.m4a">
      <button id="btnAdd" disabled>Добавить точку</button>
    </div>
    <div class="status" id="status">Точек: 0</div>
    <div class="list" id="list"></div>
    <div class="toolbar">
      <button id="btnExport">Экспорт JSON</button>
      <button id="btnImport">Импорт JSON</button>
      <input id="fileImport" type="file" accept=".json" hidden>
    </div>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // 1. Карта центрируется на Санкт-Петербурге (район маршрута)
  const map = L.map('map').setView([59.8500, 30.1000], 11);
  
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap contributors © CARTO',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  // 2. Базовый список остановок 343Э
  // ВАЖНО: Координаты указаны примерно (для демонстрации). 
  // Для точной работы замените lat/lng на реальные значения.
  const points = [
    { id: 'poi_1', title: 'Ломоносов, Вокзал', lat: 59.9110, lng: 29.7710, radius: 100, audioName: 'lomonosov_vokzal.m4a', audioUrl: null },
    { id: 'poi_2', title: 'Еленинская улица', lat: 59.9105, lng: 29.7750, radius: 100, audioName: 'eleninskaya.m4a', audioUrl: null },
    { id: 'poi_3', title: 'Владимирская улица', lat: 59.9090, lng: 29.7800, radius: 100, audioName: 'vladimirskaya.m4a', audioUrl: null },
    { id: 'poi_4', title: 'Улица Победы', lat: 59.9080, lng: 29.7850, radius: 100, audioName: 'pobedy.m4a', audioUrl: null },
    { id: 'poi_5', title: 'Красноармейская улица', lat: 59.9070, lng: 29.7900, radius: 100, audioName: 'krasnoarmeyskaya.m4a', audioUrl: null },
    { id: 'poi_6', title: 'Швейцарская улица', lat: 59.9060, lng: 29.7950, radius: 100, audioName: 'shveitsarskaya.m4a', audioUrl: null },
    { id: 'poi_7', title: 'Улица Федюнинского', lat: 59.9050, lng: 29.8000, radius: 100, audioName: 'fedyuninskogo.m4a', audioUrl: null },
    { id: 'poi_8', title: 'Улица Федюнинского, 16', lat: 59.9040, lng: 29.8050, radius: 100, audioName: 'fedyuninskogo_16.m4a', audioUrl: null },
    { id: 'poi_9', title: 'Ораниенбаумский проспект', lat: 59.9030, lng: 29.8100, radius: 100, audioName: 'oranienbaumskiy.m4a', audioUrl: null },
    { id: 'poi_10', title: 'Улица Федюнинского (по требованию)', lat: 59.9020, lng: 29.8150, radius: 100, audioName: 'fedyuninskogo_po_trebovaniyu.m4a', audioUrl: null },
    { id: 'poi_11', title: 'Улица Связи', lat: 59.9010, lng: 29.8200, radius: 100, audioName: 'svyazi.m4a', audioUrl: null },
    { id: 'poi_12', title: 'Новогорская улица', lat: 59.9000, lng: 29.8250, radius: 100, audioName: 'novogorskaya.m4a', audioUrl: null },
    { id: 'poi_13', title: 'Улица Жоры Антоненко', lat: 59.8990, lng: 29.8300, radius: 100, audioName: 'zhory_antonenko.m4a', audioUrl: null },
    { id: 'poi_14', title: 'Мордвиновка', lat: 59.8980, lng: 29.8350, radius: 100, audioName: 'mordvinovka.m4a', audioUrl: null },
    { id: 'poi_15', title: 'Фабричная улица', lat: 59.8970, lng: 29.8400, radius: 100, audioName: 'fabrichnaya.m4a', audioUrl: null },
    { id: 'poi_16', title: 'Разводная улица', lat: 59.8960, lng: 29.8450, radius: 100, audioName: 'razvodnaya.m4a', audioUrl: null },
    { id: 'poi_17', title: 'Константиновская ул., Николаевская больница', lat: 59.8950, lng: 29.8500, radius: 100, audioName: 'konstantinovskaya.m4a', audioUrl: null },
    { id: 'poi_18', title: 'Улица Аврова', lat: 59.8940, lng: 29.8550, radius: 100, audioName: 'avrova.m4a', audioUrl: null },
    { id: 'poi_19', title: 'Улица Крылова', lat: 59.8930, lng: 29.8600, radius: 100, audioName: 'krylova.m4a', audioUrl: null },
    { id: 'poi_20', title: 'Кропоткинская улица', lat: 59.8920, lng: 29.8650, radius: 100, audioName: 'kropotkinskaya.m4a', audioUrl: null },
    { id: 'poi_21', title: 'Фронтовая улица', lat: 59.8910, lng: 29.8700, radius: 100, audioName: 'frontovaya.m4a', audioUrl: null },
    { id: 'poi_22', title: 'Проспект Будённого', lat: 59.8900, lng: 29.8750, radius: 100, audioName: 'budennogo.m4a', audioUrl: null },
    { id: 'poi_23', title: 'Рогачёвский переулок', lat: 59.8890, lng: 29.8800, radius: 100, audioName: 'rogachevskiy.m4a', audioUrl: null },
    { id: 'poi_24', title: 'Улица Пионерстроя, угол пр.', lat: 59.8880, lng: 29.8850, radius: 100, audioName: 'pionerstroya.m4a', audioUrl: null },
    { id: 'poi_25', title: 'Ветеранов, угол ул. Пограничника Гарькавого', lat: 59.8870, lng: 29.8900, radius: 100, audioName: 'pogranichnika_garkavogo.m4a', audioUrl: null },
    { id: 'poi_26', title: 'Авангардная улица', lat: 59.8860, lng: 29.8950, radius: 100, audioName: 'avangardnaya.m4a', audioUrl: null },
    { id: 'poi_27', title: 'Пр. Маршала Жукова, угол пр.', lat: 59.8850, lng: 29.9000, radius: 100, audioName: 'marshala_zhukova.m4a', audioUrl: null },
    { id: 'poi_28', title: 'Солдата Корзуна', lat: 59.8840, lng: 29.9050, radius: 100, audioName: 'soldata_korzuna.m4a', audioUrl: null },
    { id: 'poi_29', title: 'Ст. метро Проспект Ветеранов', lat: 59.8830, lng: 29.9100, radius: 100, audioName: 'prospekt_veteranov.m4a', audioUrl: null }
  ];

  let markers = [];
  let pending = null;

  const fTitle = document.getElementById('fTitle');
  const fCoords = document.getElementById('fCoords');
  const fRadius = document.getElementById('fRadius');
  const fAudio = document.getElementById('fAudio');
  const btnAdd = document.getElementById('btnAdd');
  const listEl = document.getElementById('list');
  const statusEl = document.getElementById('status');

  // 3. Отрисовка существующих остановок на карте
  function initMap() {
    points.forEach(p => addMarker(p));
    renderList();
    if(points.length > 0) {
      map.fitBounds(points.map(p => [p.lat, p.lng]));
    }
  }

  map.on('click', e => {
    const { lat, lng } = e.latlng;
    pending = { lat: +lat.toFixed(6), lng: +lng.toFixed(6) };
    fCoords.value = pending.lat + ', ' + pending.lng;
    updateAddState();
    L.popup().setLatLng(e.latlng).setContent('Новая точка').openOn(map);
  });

  function updateAddState(){
    btnAdd.disabled = !(pending && fTitle.value.trim());
  }
  fTitle.addEventListener('input', updateAddState);

  btnAdd.addEventListener('click', () => {
    const file = fAudio.files[0];
    if(!pending || !fTitle.value.trim()) return;
    const point = {
      id: 'poi_' + Date.now(),
      title: fTitle.value.trim(),
      lat: pending.lat,
      lng: pending.lng,
      radius: +fRadius.value || 100,
      audioName: file ? file.name : 'audio.m4a',
      audioSize: file ? file.size : 0,
      audioUrl: null
    };
    points.push(point);
    addMarker(point);
    renderList();
    resetForm();
  });

  function addMarker(p){
    const m = L.circleMarker([p.lat, p.lng], {
      radius: 8, color: '#38bdf8', fillColor: '#38bdf8', fillOpacity: .6
    }).addTo(map);
    m.bindPopup(`<b>${p.title}</b><br>радиус ${p.radius} м<br>${p.audioName || ''}`);
    m.pointId = p.id;
    markers.push(m);
  }

  function renderList(){
    listEl.innerHTML = '';
    points.forEach((p, i) => {
      const div = document.createElement('div');
      div.className = 'point';
      div.innerHTML = `
        <b>${i+1}. ${p.title}</b>
        <div class="row"><span>${p.lat}, ${p.lng} · ${p.radius} м</span>
        <button data-id="${p.id}">удалить</button></div>
        <div class="row"><span>${p.audioName || '—'}</span></div>
      `;
      div.querySelector('button').addEventListener('click', () => removePoint(p.id));
      listEl.appendChild(div);
    });
    statusEl.textContent = 'Точек: ' + points.length;
  }

  function removePoint(id){
    const idx = points.findIndex(p => p.id === id);
    if(idx === -1) return;
    points.splice(idx, 1);
    const mIdx = markers.findIndex(m => m.pointId === id);
    if(mIdx !== -1){ map.removeLayer(markers[mIdx]); markers.splice(mIdx,1); }
    renderList();
  }

  function resetForm(){
    fTitle.value = ''; fCoords.value = ''; fRadius.value = 100; fAudio.value = '';
    pending = null; updateAddState();
  }

  document.getElementById('btnExport').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({ route: '343э', city: 'СПб', points }, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'route-343e-spb.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  const fileImport = document.getElementById('fileImport');
  document.getElementById('btnImport').addEventListener('click', () => fileImport.click());
  fileImport.addEventListener('change', () => {
    const f = fileImport.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        points.length = 0;
        markers.forEach(m => map.removeLayer(m)); markers = [];
        (data.points || []).forEach(p => { points.push(p); addMarker(p); });
        renderList();
        if(points.length) map.fitBounds(points.map(p => [p.lat, p.lng]));
      }catch(e){ alert('Ошибка чтения JSON: ' + e.message); }
    };
    reader.readAsText(f);
  });

  // Запуск после загрузки страницы
  initMap();
</script>
</body>
</html>
